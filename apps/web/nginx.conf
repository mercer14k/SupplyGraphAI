server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 26m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 100s;
        proxy_set_header Host $host;
    }
    location = /docs {
        proxy_pass http://api:8000;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
    }
    location /docs-assets/ { proxy_pass http://api:8000; }
    location = /openapi.json { proxy_pass http://api:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
