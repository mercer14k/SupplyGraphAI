[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "supplygraph-ai"
version = "0.1.0"
description = "Evidence-first, local-first supply-chain disruption intelligence"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0.38,<3", "psycopg[binary]>=3.2,<4", "networkx>=3.4,<4",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "pip-audit>=2.8,<3"]
[project.scripts]
supplygraph-generate = "supplygraph.data.generator:main"
supplygraph-benchmark = "supplygraph.evaluation.benchmark:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["postgres: requires TEST_DATABASE_URL"]
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.setuptools.package-data]
supplygraph = ["static/*"]
